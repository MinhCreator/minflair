include theme.conf

font_family JetbrainsMono NF
font_size 11
bold_font        auto
italic_font      auto
bold_italic_font auto

cursor_trail 2
window_padding_width 16
confirm_os_window_close 0

# --- splits ---
enabled_layouts splits:split_axis=auto

map ctrl+shift+enter new_window_with_cwd

map alt+shift+left  neighboring_window left
map alt+shift+right neighboring_window right
map alt+shift+up    neighboring_window top
map alt+shift+down  neighboring_window bottom
